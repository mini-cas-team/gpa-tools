# gpa-tools configuration -- template.
#
# The installer (/install-gpa-tools in Claude Code, or install/configure.py)
# copies this to config.yaml and fills in the folders, model and Ollama URL.
# config.yaml is machine-local and not committed; this file is.

# --- folders ------------------------------------------------------------------
pdf-folder: ~/gpa-tools-data/transcripts # transcript PDFs to read
work-folder: ~/gpa-tools-data/work # .txt and .common.json made by upload
out-folder: ~/gpa-tools-data/out # rankings (llm_category writes to out/llm_category/)
log-folder: ~/gpa-tools-data/log # upload.log, llm_category.log, browser_view.log

# --- ranking --------------------------------------------------------------------
min-category-courses: 4 # hold back students with fewer category courses
# jobs: 0                         # gpa_ana parallel workers (0 = one per CPU); CLI: -j N
# ocr-dpi: 300                    # gpa_ana render resolution for scanned pages

# --- gpa_ana --------------------------------------------------------------------
category: [STEM] # rulesets in gpa_ana/categories/rulesets/

# --- external tools -------------------------------------------------------------
# Folders holding pdftotext / pdftoppm / tesseract when they are not on PATH
# (the installer puts them in .tools/ when there is no admin access).
# tool-folders: []

# --- llm_category (python -m llm_category --category STEM) ----------------------
llm-category:
  model: qwen2.5:3b # any model in `ollama list`; the installer picks one for this machine
  ollama-url: http://localhost:11434

# --- category definitions (llm_category) ------------------------------------
# Written by llm_category and the browser_view Upload tab; edit freely.
# Changing a definition clears that category's cached answers on the next run.
# Delete an entry to have the LLM write a new one.
category-definitions: {}

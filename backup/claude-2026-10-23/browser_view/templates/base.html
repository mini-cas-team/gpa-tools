<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Transcripts and Recommendation Letters{% endblock %}</title>
<style>
  :root {
    --bg: #ffffff; --fg: #1a1c1e; --muted: #5c6269; --line: #d8dce0;
    --panel: #f6f7f9; --accent: #2f5fd0; --warn: #8a5a00; --bad: #9b2226;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16181b; --fg: #e6e8ea; --muted: #9aa1a8; --line: #2e3237;
      --panel: #1e2125; --accent: #7aa2f7; --warn: #d9a23a; --bad: #e06c75;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: 15px/1.55 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  main { max-width: 68rem; margin: 0 auto; }
  h1 { font-size: 1.4rem; margin: 0 0 .25rem; }
  h2 { font-size: 1.1rem; margin: 2rem 0 .6rem; }
  h3 { font-size: .95rem; margin: 1.4rem 0 .4rem; }
  a { color: var(--accent); }
  fieldset { min-width: 0; border: 1px solid var(--line); border-radius: 8px; padding: 1rem 1.1rem; margin: 0 0 1.1rem; }
  legend { padding: 0 .4rem; font-weight: 600; font-size: .9rem; }
  label { display: block; margin: .55rem 0 .2rem; font-size: .88rem; color: var(--muted); }
  input[type=text], input[type=number], input[type=file], select {
    width: 100%; padding: .5rem .6rem; border: 1px solid var(--line);
    border-radius: 6px; background: var(--bg); color: var(--fg); font: inherit;
  }
  .inline { display: flex; gap: 1.2rem; flex-wrap: wrap; align-items: center; }
  .inline label { display: flex; align-items: center; gap: .4rem; margin: 0; color: var(--fg); }
  .inline input { width: auto; }
  .hint { font-size: .82rem; color: var(--muted); margin: .35rem 0 0; }
  button {
    padding: .6rem 1.2rem; border: 0; border-radius: 6px; background: var(--accent);
    color: #fff; font: inherit; font-weight: 600; cursor: pointer;
  }
  .error {
    border-left: 3px solid var(--bad); background: var(--panel);
    padding: .7rem .9rem; border-radius: 0 6px 6px 0; margin: 0 0 1.2rem;
  }
  table { border-collapse: collapse; width: 100%; font-size: .88rem; }
  th, td { text-align: left; padding: .4rem .55rem; border-bottom: 1px solid var(--line); }
  th { color: var(--muted); font-weight: 600; white-space: nowrap; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  tbody tr:hover { background: var(--panel); }
  .panel { background: var(--panel); border-radius: 8px; padding: .9rem 1.1rem; }
  .tag { font-size: .78rem; padding: .1rem .4rem; border-radius: 4px; border: 1px solid var(--line); }
  .pass { color: #1a7f37; } .fail { color: var(--bad); font-weight: 600; }
  ul.notes { margin: .4rem 0 0; padding-left: 1.1rem; }
  ul.notes li { margin: .2rem 0; font-size: .86rem; }
  .warn { color: var(--warn); }
  code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: .85em; }
  /* Title and tabs stay put while the page scrolls under them. */
  header.top {
    position: sticky; top: 0; z-index: 10; background: var(--bg);
    padding-top: 2rem; margin: 0 0 1.5rem;
  }
  /* Left bar: the page list, pinned while the page scrolls. */
  .layout { display: flex; min-height: 100vh; }
  nav.side {
    position: sticky; top: 0; align-self: flex-start; flex: 0 0 11rem; height: 100vh;
    display: flex; flex-direction: column; gap: .2rem; padding: 2rem .6rem 1rem;
    background: var(--panel); border-right: 1px solid var(--line);
  }
  nav.side a {
    padding: .5rem .8rem; border-radius: 6px; color: var(--muted); text-decoration: none; font-weight: 600;
  }
  nav.side a.sub + .group { margin-top: .8rem; }
  nav.side .group { padding: .5rem .8rem; color: var(--fg); font-weight: 600; }
  nav.side a.sub { margin-left: .9rem; padding: .35rem .8rem; font-size: .88rem; font-weight: 500; }
  nav.side a:hover { color: var(--fg); background: var(--bg); }
  nav.side a.active { color: var(--accent); background: var(--bg); box-shadow: inset 3px 0 var(--accent); }
  .layout > main { flex: 1; min-width: 0; padding: 0 1rem 2rem; }
  button:disabled { opacity: .6; cursor: progress; }
  .status { margin: 1.4rem 0 0; }
  .status .ok { border-left: 3px solid #1a7f37; }
  .status .running { border-left: 3px solid var(--accent); }
  .status .error { margin: 0; }
  .status > div { padding: .7rem .9rem; border-radius: 0 6px 6px 0; background: var(--panel); }
  .view-controls { display: flex; gap: .8rem; align-items: flex-end; flex-wrap: wrap; margin: 0 0 1.2rem; }
  .view-controls .grow { flex: 1 1 18rem; }
  .view-controls label { margin-top: 0; }
  .view-controls select { min-width: 10rem; }
  .help { max-width: 46rem; }
  .help ol { padding-left: 1.3rem; }
  .help li { margin: .35rem 0; }
  .help h2 { margin-top: 1.6rem; }
  .table-wrap { overflow-x: auto; }
  /* Rows scroll inside the table; the header row stays put. */
  .table-wrap.scroll { overflow: auto; max-height: max(16rem, calc(100vh - 19rem)); border-bottom: 1px solid var(--line); }
  .scroll thead th { position: sticky; top: 0; z-index: 1; background: var(--bg); box-shadow: inset 0 -1px var(--line); }
  .scroll th, .scroll td { border-bottom-color: var(--line); }
  th button.sort {
    all: unset; cursor: pointer; display: inline-flex; gap: .3rem; align-items: center;
  }
  th button.sort:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  th button.sort::after { content: "↕"; opacity: .35; font-size: .8em; }
  th[aria-sort=ascending] button.sort::after { content: "▲"; opacity: 1; }
  th[aria-sort=descending] button.sort::after { content: "▼"; opacity: 1; }
  th[aria-sort] { color: var(--fg); }
  tr.student { cursor: pointer; }
  /* Follows the pointer over the table body; shown at once, unlike a title. */
  .row-tip {
    position: fixed; z-index: 20; pointer-events: none; padding: .3rem .55rem;
    border-radius: 5px; background: var(--fg); color: var(--bg); font-size: .8rem;
    white-space: nowrap; box-shadow: 0 2px 8px rgb(0 0 0 / .2);
  }
  tr.student:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  dialog {
    width: calc(100vw - 2rem); max-width: 110rem; height: calc(100vh - 2rem); max-height: none;
    padding: 0; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); color: var(--fg);
  }
  dialog::backdrop { background: rgb(0 0 0 / .45); }
  dialog[open] { display: flex; flex-direction: column; }
  .dialog-head {
    display: flex; justify-content: space-between; align-items: flex-start; gap: 1rem;
    padding: 1rem 1.2rem .6rem; border-bottom: 1px solid var(--line);
  }
  .dialog-head h2 { margin: 0; }
  .dialog-head .hint { margin: .25rem 0 0; }
  .dialog-head .close {
    background: none; color: var(--muted); font-size: 1.5rem; line-height: 1; padding: .1rem .5rem;
  }
  .dialog-head .close:hover { color: var(--fg); }
  /* Original PDF on the left, extracted courses on the right. */
  .dialog-body {
    flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 6fr);
  }
  .dialog-body[hidden] { display: none; }
  /* The student dialog's Transcript / Recommendation letters tabs. */
  .dialog-tabs { display: flex; gap: .25rem; padding: 0 1.2rem; border-bottom: 1px solid var(--line); }
  .dialog-tabs button {
    background: none; color: var(--muted); border-radius: 0; padding: .55rem 1rem;
    border-bottom: 2px solid transparent; margin-bottom: -1px;
  }
  .dialog-tabs button:hover { color: var(--fg); }
  .dialog-tabs button[aria-selected="true"] { color: var(--accent); border-bottom-color: var(--accent); }
  .dialog-body > section { min-height: 0; display: flex; flex-direction: column; padding: .8rem 1.2rem 1.2rem; }
  .dialog-body > section + section { border-left: 1px solid var(--line); }
  .pdf-pane iframe { flex: 1; width: 100%; border: 1px solid var(--line); border-radius: 6px; background: #fff; }
  .courses-pane .table-wrap.scroll { flex: 1; max-height: none; }
  .dialog-body .error { margin: 0; }
  table.courses { font-size: .82rem; }
  table.courses th, table.courses td { padding: .3rem .4rem; }
  table.courses td.term { color: var(--muted); max-width: 8rem; }
  table.courses td.code { white-space: nowrap; }
  table.courses tr.in-category td:not(.term) { font-weight: 600; }
  @media (max-width: 900px) {
    .dialog-body { display: block; overflow: auto; }
    .dialog-body > section + section { border-left: 0; border-top: 1px solid var(--line); }
    .pdf-pane iframe { height: 70vh; flex: none; }
  }
  /* Upload tab: upload form on the left, categories on the right. */
  .split { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 1.5rem; align-items: start; }
  .split.single { grid-template-columns: minmax(0, 1fr); }
  .split > section > h2:first-child { margin-top: 0; }
  .split h2 a { color: inherit; text-decoration: none; }
  .split h2 a:hover { color: var(--accent); }
  /* Each panel scrolls on its own; --split-top is measured in upload.html. */
  .split > section {
    height: calc(100vh - var(--split-top, 10rem) - 2rem); overflow-y: auto;
    overscroll-behavior: contain; padding-right: .4rem;
  }
  .category-bar { display: flex; flex-wrap: wrap; gap: .5rem; align-items: center; }
  .category-bar select { flex: 1 1 4rem; width: auto; min-width: 0; }
  .category-bar select.builder { flex: 0 0 auto; }
  .category-bar label { margin: 0; color: var(--fg); font-weight: 600; }
  .category-bar label + button { margin-left: auto; }
  .progress { margin: .9rem 0 0; }
  .progress progress { width: 100%; }
  .add-row { display: flex; gap: .5rem; margin: .7rem 0 0; }
  .add-row input { flex: 1; }
  .definition { margin: .9rem 0 0; white-space: pre-wrap; }
  textarea {
    width: 100%; padding: .5rem .6rem; border: 1px solid var(--line); border-radius: 6px;
    background: var(--bg); color: var(--fg); font: inherit; resize: vertical;
  }
  .dialog-actions { display: flex; justify-content: flex-end; gap: .5rem; margin: .9rem 0 0; }
  button.secondary { background: var(--panel); color: var(--fg); border: 1px solid var(--line); }
  button.toggle[aria-pressed="true"] { background: var(--accent); color: #fff; border-color: var(--accent); }
  @media (max-width: 900px) {
    .split { grid-template-columns: 1fr; }
    .split > section { height: auto; overflow: visible; padding-right: 0; }
  }
  @media (max-width: 640px) {
    header.top { padding-top: 1.2rem; }
    .layout { display: block; }
    nav.side {
      position: static; height: auto; flex-direction: row; flex-wrap: wrap; align-items: center; padding: .5rem 1rem;
      border-right: 0; border-bottom: 1px solid var(--line);
    }
    nav.side a.sub { margin-left: 0; }
    nav.side a.sub + .group { margin-top: 0; margin-left: .6rem; }
  }
</style>
<div class="layout">
  <nav class="side" aria-label="Pages">
    <span class="group">Transcripts</span>
    <a href="/transcripts/ftp-upload" class="sub{% if tab == "ftp-upload" %} active" aria-current="page{% endif %}">FTP Upload</a>
    <a href="/transcripts/category-build" class="sub{% if tab == "category-build" %} active" aria-current="page{% endif %}">Category Build</a>
    <a href="/view" class="sub{% if tab == "view" %} active" aria-current="page{% endif %}">View</a>
    <span class="group">Recommendations</span>
    <a href="/letters/ftp-upload" class="sub{% if tab == "letters-upload" %} active" aria-current="page{% endif %}">FTP Upload</a>
    <a href="/letters/view" class="sub{% if tab == "letters-view" %} active" aria-current="page{% endif %}">View</a>
  </nav>
  <main>
    <header class="top">
      <h1>Transcripts and Recommendation Letters</h1>
    </header>
    {% block body %}{% endblock %}
  </main>
</div>

notes: >
  One profile for a family of Maryland institutions that print an identical
  transcript: the same five-band header (Course/Title/Grade/Credits/Points), the
  same printed 4.00 grading key, the same course-code shape and the same
  eighteen department tokens, which carry the same meaning at every one of them.
  Only the school name differs, and it is on line 1 -- so it is read from the
  page (institution_from) rather than hardcoded, and adding a school costs one
  fingerprint line instead of a whole file plus a duplicate ruleset block.

  Fingerprints are the literal school names on purpose.  A shape-based
  fingerprint would be shorter but would compete with the single-school
  profiles for their own documents; naming the members keeps dispatch
  unambiguous and makes membership an explicit decision.

  Split a school out into its own profile the moment any of layout, grade
  scale, code grammar or *department meaning* diverges -- the last is the one
  that is a judgement call rather than an observation.  A profile of its own
  simply lists that school's name here removed, and nothing else changes.

# gpa-tools configuration
#
# Every component has a folder of raw input, <input-folder>/<component>/, and a
# folder of what the tools make from it, <work-folder>/<component>/ (folders.py):
#   transcripts  <name>.pdf             -> <name>.txt, <name>.common.json
#   letters      <key>_letter<N>.pdf    -> <key>_letter<N>.txt, letter_ranks.csv
#   personal     <name>.profile         -> <name>.json

components: [transcripts, letters, personal]
input-folder: /home/personal/Templates # raw input, never written by a run
work-folder: /home/personal/Templates/work # made from the input; builders keep their files in <work-folder>/<builder>/
out-folder: /home/personal/Templates/out # published <cat>_gpa.csv, for other applications
log-folder: /home/personal/Templates/log
# --- optional settings (defaults shown) -------------------------------------
min-category-courses: 4 # View tab: hide students with fewer category courses
run_mode: dev # dev: the student dialog's letters tab also shows Jev's own rank and confidence; anything else hides them

# --- category builders --------------------------------------------------------
# python -m category_builder --category STEM [--builder llm] [--publish]
# Each reads the *.common.json in <work-folder>/transcripts and writes <cat>_gpa.csv and
# <cat>_courses.csv into <work-folder>/<builder>/. python -m out_builder copies
# <cat>_gpa.csv to out-folder (the Upload tab does that after each run).
active-category-builder: jev # the default in the Upload and View tabs
category-builder:
  llm: # a local LLM answers yes/no per course; logs to <log-folder>/llm_category.log
    category-build-model: qwen2.5:3b # yes/no per course; changing it clears the cached answers
    category-definition-model: qwen2.5:7b # category-definer's ollama step; one call per category, so a bigger model is affordable
    ollama-url: http://localhost:11434 # any model in `ollama list` there
  jev: # TypeSafe's Jev scores each course 0-1; logs to <log-folder>/jev_category.log
    model: jev-1.14.0 # a version pins it; `jev-latest` follows new releases
    api-url: https://api.typesafe.ai/v1/systemone
    api-key-env: GPA_TOOLS_KEY # name of the env var holding the key; never put the key here
    threshold: 0.5 # a course is in the category when Jev's score is above this
    batch-size: 20 # courses per request

# --- category-definer: drafts a definition for the user to edit -------------------
# Tries the mode's steps in turn until one gives a definition. chatgpt and gemini
# are their free web chats, used anonymously (no account, no key) in the installed
# Chrome or Edge; ollama is category-builder: llm: category-definition-model. Every try is logged to
# <log-folder>/category_definer.log and shown in the Upload tab.
category-definer:
  mode: dev # dev: chatgpt -> gemini -> ollama, in visible browser windows (needs a desktop)
  #           prod: gemini (headless, no window) -> ollama
  retries: 1 # extra tries for chatgpt and gemini (ollama is tried once)
  browser-timeout: 120 # seconds to wait for a site's reply
  browser: auto # auto (Chrome, else Edge, else Playwright's Chromium), chrome, msedge, chromium
  # profile-folder: ~/gpa-tools-data/work/browser-profiles # default <work-folder>/browser-profiles

# --- rank-ai: View → Rank's Ask AI box --------------------------------------------
# Turns a request in plain words into Student Rank's filters. The providers are tried
# in turn until one answers: ollama (local, nothing leaves the machine), gemini and
# chatgpt (their free web chats, like category-definer's; they receive the prompt,
# which lists every known profile value such as cities and institutions, but no
# student names), claude (the Anthropic API; key in claude-api-key-env).
# Every request is logged to <log-folder>/rank_ai.log.
rank-ai:
  providers: [ollama] # e.g. [ollama, gemini]
  repairs: 1 # asks the same provider again, with the problems, when its answer does not fit
  # model: qwen2.5:7b # ollama; default category-builder: llm: category-definition-model
  # num-ctx: 16384 # ollama context (tokens); the prompt lists every known value
  # timeout: 600 # seconds per ollama or claude answer
  # claude-model: claude-sonnet-5-5
  # claude-api-key-env: ANTHROPIC_API_KEY

# --- category definitions (all builders) ------------------------------------
# Shared by every category builder; drafted by category-definer, edit freely.
# Changing a definition clears the llm builder's cached answers for it.
# Delete an entry to have category-definer draft a new one.
category-definitions:
  LAW: LAW includes the academic study of legal systems, legislation, constitutional law,
    criminal law, civil law, contract law, property law, international law, jurisprudence,
    legal institutions, legal procedures, and the application and interpretation of laws.
    Borderline subjects NOT included are political science, public administration, criminology,
    sociology, ethics, philosophy, business management, and economics, unless their primary
    focus is the study of law itself.
  MEDICAL: The MEDICAL category includes courses focused on health sciences, including anatomy,
    physiology, microbiology, pharmacology, and medical genetics. It also encompasses allied
    health fields such as nursing, physical therapy, and occupational therapy. Subjects like
    veterinary medicine (which focuses on animals) are not included in this category, as they
    are categorized under a separate 'ANIMAL SCIENCE' category. Additionally, courses that
    primarily focus on public health or healthcare policy are typically placed under the broader
    'SOCIAL SCIENCES' category.
  STEM: STEM stands for Science, Technology, Engineering, and Mathematics. This category includes
    subjects such as biology, chemistry, physics, computer science, engineering disciplines
    like civil, mechanical, and electrical engineering, and mathematics. Subjects like fine
    arts, literature, philosophy, and humanities are typically not included in the STEM category,
    as they do not fall under the scientific or technological domains that are central to
    these fields.

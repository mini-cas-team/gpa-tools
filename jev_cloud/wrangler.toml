name = "gpa-tools-jev"
main = "src/index.js"
compatibility_date = "2026-10-01"
workers_dev = true      # https://gpa-tools-jev.<subdomain>.workers.dev
preview_urls = false    # no extra public URLs for untested versions

# Secrets (never here): npx wrangler secret put TYPESAFE_API_KEY
#                       npx wrangler secret put ADMIN_TOKEN
[vars]
JEV_MODEL = "jev-1.14.0"                              # changing it starts a new set of shared scores
TYPESAFE_URL = "https://api.typesafe.ai/v1/systemone"
DAILY_LIMIT = "5000"                                  # Jev questions per token per UTC day; "0" = no limit

# The data files (scores/, definitions/, tokens.json, usage/); the same files the local
# server keeps in jev_cloud/data/.  Make it once: npx wrangler r2 bucket create gpa-tools-jev
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "gpa-tools-jev"

[observability]
enabled = true
